    - name: Download MacTeX installer
      get_url:
        url: https://mirror.ctan.org/systems/mac/mactex/MacTeX.pkg
        dest: /tmp/MacTeX.pkg

    - name: Install MacTeX
      command: sudo installer -pkg /tmp/MacTeX.pkg -target /


    - name: Ensure pyenv is installed
      homebrew:
        name: pyenv
        state: present

    - name: Add pyenv init to .zshrc
      lineinfile:
        path: "{{ ansible_env.HOME }}/.zshrc"
        line: '{{ item }}'
        create: yes
      with_items:
        - 'export PYENV_ROOT="$HOME/.pyenv"'
        - 'export PATH="$PYENV_ROOT/bin:$PATH"'
        - 'eval "$(pyenv init --path)"'
        - 'eval "$(pyenv init -)"'


    - name: Install latest stable Python with pyenv
      shell: |
        export PYENV_ROOT="$HOME/.pyenv"
        export PATH="$PYENV_ROOT/bin:$PATH"
        eval "$(pyenv init --path)"
        eval "$(pyenv init -)"

        # Get latest stable version (filter out betas, alphas, dev)
        latest=$(pyenv install --list | grep -E '^\s*3\.[0-9]+\.[0-9]+$' | tail -1 | tr -d ' ')
        
        # Install and set as global
        pyenv install -s "$latest"
        pyenv global "$latest"
      args:
        executable: /bin/zsh

    - name: Install pyenv-virtualenv
      homebrew:
        name: pyenv-virtualenv
        state: present

    - name: Add pyenv-virtualenv init to .zshrc
      lineinfile:
        path: "{{ ansible_env.HOME }}/.zshrc"
        line: 'eval "$(pyenv virtualenv-init -)"'



    