---
- name: Ensure unzip is installed
  community.general.homebrew:
    name: unzip
    state: present
  tags: cursor

- name: Download Cursor AI zip (follows redirect)
  ansible.builtin.get_url:
    url: https://download.cursor.so/mac
    dest: /tmp/cursor.zip
    mode: '0644'
  tags: cursor

- name: Unzip Cursor AI
  ansible.builtin.unarchive:
    src: "/tmp/cursor.zip"
    dest: "/tmp/"
    remote_src: yes
  tags: cursor

- name: Move Cursor to Applications
  ansible.builtin.command: mv /tmp/Cursor.app /Applications/Cursor.app
  args:
    creates: /Applications/Cursor.app
  tags: cursor

- name: Clean up zip file
  ansible.builtin.file:
    path: "/tmp/cursor.zip"
    state: absent
  tags: cursor
