---
- name: Install Docker CLI
  community.general.homebrew:
    name: docker
    state: present
  tags: docker

- name: Install Docker Compose CLI (optional)
  community.general.homebrew:
    name: docker-compose
    state: present
  tags: docker

- name: Install Docker Desktop via Cask
  community.general.homebrew_cask:
    name: docker
    state: present
    install_options: ['--force']
  tags: docker

- name: Ensure Docker CLI is in PATH via .zshrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: 'export PATH="/usr/local/bin:$PATH"'
    state: present
  when: ansible_env.SHELL is search("/zsh")
  tags: docker
