---
- name: Ensure pyenv is installed
  homebrew:
    name: pyenv
    state: present
  tags: python

- name: Add pyenv init to shell
  blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    block: |
      export PYENV_ROOT="$HOME/.pyenv"
      export PATH="$PYENV_ROOT/bin:$PATH"
      eval "$(pyenv init --path)"
      eval "$(pyenv init -)"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: PYENV"
  tags: python

- name: Install latest stable Python with pyenv
  shell: |
    export PYENV_ROOT="$HOME/.pyenv"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init --path)"
    eval "$(pyenv init -)"
    latest=$(pyenv install --list | grep -E '^\s*3\.[0-9]+\.[0-9]+$' | tail -1 | tr -d ' ')
    pyenv install -s "$latest"
    pyenv global "$latest"
  args:
    executable: /bin/zsh
  tags: python

- name: Install pyenv-virtualenv
  homebrew:
    name: pyenv-virtualenv
    state: present
  tags: python

- name: Add pyenv-virtualenv init to shell
  lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: 'eval "$(pyenv virtualenv-init -)"'
    insertafter: EOF
  tags: python
