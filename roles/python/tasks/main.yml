---
- name: Ensure pyenv is installed
  community.general.homebrew:
    name: pyenv
    state: present
  tags: python

- name: Add pyenv init to shell
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    block: |
      export PYENV_ROOT="$HOME/.pyenv"
      export PATH="$PYENV_ROOT/bin:$PATH"
      eval "$(pyenv init --path)"
      eval "$(pyenv init -)"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: PYENV"
  tags: python

- name: Install latest stable Python with pyenv
  ansible.builtin.shell: |
    set -o pipefail
    export PYENV_ROOT="$HOME/.pyenv"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init --path)"
    eval "$(pyenv init -)"
    latest=$(pyenv install --list | grep -E '^\s*3\.[0-9]+\.[0-9]+$' | tail -1 | tr -d ' ')
    pyenv install -s "$latest"
    pyenv global "$latest"
  args:
    executable: /bin/zsh
  changed_when: false
  tags: python


- name: Install pyenv-virtualenv
  community.general.homebrew:
    name: pyenv-virtualenv
    state: present
  tags: python

- name: Add pyenv-virtualenv init to shell
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: 'eval "$(pyenv virtualenv-init -)"'
    insertafter: EOF
  tags: python

- name: Install Pillow (PIL replacement) with pip
  ansible.builtin.pip:
    name: pillow
    state: present
    executable: "{{ ansible_env.HOME }}/.pyenv/shims/pip"
  tags: python
